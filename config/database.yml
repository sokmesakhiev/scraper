default: &default
  adapter: postgresql
  encoding: unicode
  schema_search_path: public
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  host: localhost
  username: postgres
  password: postgres
  database: bing-data-scraper_development
  timeout: 1500

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  host: localhost
  username: postgres
  password: postgres
  database: bing-data-scraper_test
  timeout: 1500


# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  adapter: postgresql
  host: <%= Rails.application.credentials.dig(:postgres_host) %>
  database: data_scraper
  username: postgres
  password: <%= Rails.application.credentials.dig(:postgres_password) %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 1500
