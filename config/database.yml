# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: postgresql
  encoding: unicode
  username: postgres
  password: postgres
  host: localhost
  schema_search_path: public
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: bing-scraper_development
  schema_search_path: public
  timeout: 1500

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  schema_search_path: public
  database: bing-scraper_test
  timeout: 1500


# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  <<: *default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= Rails.application.credentials.dig(:postgres_host) %>
  database: scraper
  username: postgres
  password: <%= Rails.application.credentials.dig(:postgres_password) %>
  schema_search_path: public
  timeout: 1500

cache:
  production:
    database: scraper_cache
    adapters: postgresql
    <<: *default

queue:
  production:
    <<: *default
    database: scraper_queue
    adapters: postgresql
    workers:
      - queues: "*"
        threads: 3
        processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
        polling_interval: 1

