name: Deploy Rails App with Kamal

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Deploy via Kamal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Set up SSH for Kamal deployment
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{secrets.SSH_PRIVATE_KEY}}" > ~/.ssh/id_rsa
          echo "${{secrets.SSH_PUBLIC_KEY}}" > ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa.pub
      # ssh-keyscan -H "${{secrets.SERVER_HOST}}" >> ~/.ssh/known_hosts

      # Install Ruby (needed for Kamal)
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install Kamal
        run: gem install kamal

      # Login to Docker Registry
      - name: Login Docker Registry
        run: |
          echo "${{secrets.KAMAL_REGISTRY_PASSWORD}}" | docker login \
            -u "${{secrets.KAMAL_REGISTRY_USERNAME}}" \
            --password-stdin

      # Deploy
      - name: Run Kamal Deploy
        env:
          RAILS_MASTER_KEY: ${{secrets.RAILS_MASTER_KEY}}
          KAMAL_REGISTRY_PASSWORD: ${{secrets.KAMAL_REGISTRY_PASSWORD}}
        run: |
          kamal deploy
